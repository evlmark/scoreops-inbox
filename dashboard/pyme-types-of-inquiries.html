  .type-group-head.type-Позитив{ border-left-color:var(--good); } .type-group-head.type-Позитив .tg-name{ color:var(--good); }
  .mega-theme-card.type-Отмена{ border-left-color:var(--warn); } .mega-theme-card.type-Отмена .tg-name{ color:var(--warn); }
  .mega-theme-card.type-Позитив{ border-left-color:var(--good); } .mega-theme-card.type-Позитив .tg-name{ color:var(--good); }
  .type-group-head.theme-origination{ border-left-color:var(--accent); } .type-group-head.theme-origination .tg-name{ color:var(--accent-strong); }
  .type-group-head.theme-aml_kyb{ border-left-color:var(--critical); } .type-group-head.theme-aml_kyb .tg-name{ color:var(--critical); }
  .type-group-head.theme-payments{ border-left-color:var(--call); } .type-group-head.theme-payments .tg-name{ color:var(--call); }

function renderCsatChart(){
  const u = UI[currentLang];
  const answered = CSAT_DATA.liked + CSAT_DATA.disliked;
  const likePct = (CSAT_DATA.liked/(answered||1)*100).toFixed(0);
  const rt = CSAT_DATA.reasons;
  const rTotal = rt.product + rt.agent + rt.other;

  const trendRows = CSAT_WEEKLY_TREND.map(w => {
    const ans = w.liked + w.disliked;
    const pct = ans ? (w.liked/ans*100) : 0;
    return `<div class="trend-row">
      <span class="trend-label">${u[w.key]}</span>
      <div class="trend-track"><div class="trend-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <span class="trend-value num">${pct.toFixed(0)}% (${ans})</span>
    </div>`;
  }).join("");

  const reasonRows = CSAT_REASON_TREND.map(c => {
    const [a,b,c3] = c.w;
    const delta = c3-b;
    const dCls = Math.abs(delta) < 1.5 ? "delta-flat" : (delta>0 ? "delta-up" : "delta-down");
    const dSign = delta>0 ? "+" : "";
    return `<tr>
      <td class="name">${u[c.key]}</td>
      <td class="num">${a.toFixed(1)}%</td>
      <td class="num">${b.toFixed(1)}%</td>
      <td class="num">${c3.toFixed(1)}%</td>
      <td class="num ${dCls}">${dSign}${delta.toFixed(1)} pp</td>
    </tr>`;
  }).join("");

  const badgeKey = {product:"csatReasonProduct", agent:"csatReasonAgent", other:"csatReasonOther"};
  const badgeColor = {product:"var(--critical)", agent:"var(--warn)", other:"var(--text-faint)"};
  const dislikeRows = ["product","agent","other"].map(cat => {
    const items = CSAT_DATA.dislikesUnattributed.filter(d => d.cat === cat);
    if(!items.length) return "";
    const rows = items.map(d => {
      const body = d.note ? `<span style="color:var(--text-faint); font-style:italic;">${esc(t(d.note))}</span>` : `«${esc(t({ru:d.ru,en:d.en,es:d.es}))}»${currentLang!=="es" ? `<div class="ru" style="margin-top:2px;">«${esc(d.es)}»</div>` : ""}`;
      return `<div class="quote" style="border-left-color:${badgeColor[cat]};"><div class="es">${body}</div></div>`;
    }).join("");
    return `<div class="mini-split-title" style="margin-top:14px; color:${badgeColor[cat]};">${u[badgeKey[cat]]} (${items.length})</div>${rows}`;
  }).join("");

  let csatSegHtml = "";
  if(anySegActive() && activeChan !== "Звонки"){
    const ten = activeTenureSeg, pf = activePfpmSeg;
    if(bothSegActive()){

    } else {
      const ansN = ten !== "all" ? CSAT_SEG.tenure[ten] : CSAT_SEG.pfpm[pf];
      const disN = ten !== "all" ? CSAT_SEG.dislikeTenure[ten] : CSAT_SEG.dislikePfpm[pf];
      const pct = ansN ? ((ansN-disN)/ansN*100).toFixed(0) : "—";
      const noteText = u.csatSegNote.replace("{pct}",pct).replace("{ans}",ansN).replace("{dis}",disN).replace("{sample}",CSAT_SEG.answeredSample).replace("{pub}",CSAT_SEG.answeredPublished);
      csatSegHtml = `<div class="cat-trend-caveat" style="margin-bottom:12px;">${noteText}</div>`;
    }
  }

  document.getElementById("csatChart").innerHTML = `
    ${csatSegHtml}
    <div class="mini-split-block">
      <div class="mini-split-track">
        <span style="width:${likePct}%; background:var(--good);"></span>
        <span style="width:${100-likePct}%; background:var(--critical);"></span>
      </div>
      <div class="mini-split-legend">
        <span><b class="num">${CSAT_DATA.liked}</b> ${u.csatLiked} (${likePct}%)</span>
        <span><b class="num">${CSAT_DATA.disliked}</b> ${u.csatDisliked}</span>
        <span><b class="num">${answered}</b> ${u.csatAnswered} <b class="num">${CSAT_DATA.sent}</b> ${u.csatSent}</span>
      </div>
    </div>
    <div class="mini-split-block">
      <div class="mini-split-title">${u.csatTrendTitle}</div>
      ${trendRows}
    </div>
    <div class="mini-split-block">
      <div class="mini-split-title">${u.csatReasonTrendTitle}</div>
      <div style="overflow-x:auto;">

        <thead><tr><th></th><th class="num">${u.weekShort1}</th><th class="num">${u.weekShort2}</th><th class="num">${u.weekShort3}</th><th class="num">Δ</th></tr></thead>
        <tbody>${reasonRows}</tbody>

      <div class="split">

  return CATS.filter(c => activeChan === "all" || c.channel === activeChan);

function renderKpis(){
  const u = UI[currentLang];
  const anySeg = anySegActive();
  const cats = filteredCatsByChannel();
  const ticketTotal = anySeg ? cats.reduce((s,c)=>s+segCount(c),0) : cats.reduce((s,c)=>s+c.chats+c.calls,0);
  const catCount = cats.filter(c => anySeg ? segCount(c) > 0 : true).length;
  // Clients KPI only ever shows a verified distinct-client figure (TENURE_NOW/PFPM_NOW, chats-only by definition)
  // — never a sum of per-category `clients`, since that double-counts clients who appear in multiple categories.
  const baseClients = TENURE7_ORDER.reduce((s,k)=>s+(TENURE_NOW[k]||0),0);
  let clientsVal = null;
  if(activeChan === "Звонки") clientsVal = null; // no distinct-client figure exists for a calls-only view
  else if(!anySeg) clientsVal = baseClients;
  else if(bothSegActive()) clientsVal = null; // no verified joint distinct-client figure exists for tenure+PFAE/PM combined
  else if(activeTenureSeg !== "all") clientsVal = TENURE_NOW[activeTenureSeg];
  else clientsVal = PFPM_NOW[activePfpmSeg];
  const clientsHtml = clientsVal === null
    ? `<div class="v num">—</div><div class="l">${u.kpiClients} (${u.chatsWord})</div>`
    : `<div class="v num">${clientsVal}</div><div class="l">${u.kpiClients} (${u.chatsWord})</div>`;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="v num">${ticketTotal}</div><div class="l">${u.kpiFcr}</div></div>

}

const CLOSURE_BASE = CLOSURES.reduce((s,c)=>s+c.clients,0); // 68: 60 across 11 named closure reasons + 8 across 2 "saved" groups (6 plan-downgrade-miscaptured + 2 retained). Both branches below share this combined base so their two percentages (88.2% + 11.8%) add up to 100%.
function closureSegCount(c){
  if(!c.seg || bothSegActive()) return null;
  if(activeTenureSeg !== "all") return c.seg.tenure[activeTenureSeg];
  if(activePfpmSeg !== "all") return c.seg.pfpm[activePfpmSeg];
  return null;
}
function renderCloMegaItem(c){
  const u = UI[currentLang];
  const pct = c.clients / CLOSURE_BASE * 100;
  const showSeg = anySegActive();
  const segN = showSeg ? closureSegCount(c) : null;
  const metricHtml = !showSeg
    ? `<span class="v num">${c.clients}</span> ${u.clientsWord} · <span class="v num">${pct.toFixed(1)}%</span>`
    : bothSegActive()
      ? `<span class="v num">—</span>`
      : `<span class="v num">${segN}</span> ${u.clientsWord}`;
  const segNoteHtml = !showSeg ? "" : `<div class="cat-trend-caveat" style="margin-top:8px;">${
      bothSegActive()
        ? u.closuresSegBoth
        : u.closuresSegNote.replace("{classified}", c.seg.classified).replace("{published}", c.clients)
    }</div>`;
  const quotesHtml = c.quotes.map(q => {
    const secondary = currentLang!=="es" ? `<div class="ru">→ «${esc(t({ru:q.ru,en:q.en,es:""}))}»</div>` : "";
    const idLine = q.customerid ? `<div class="quote-id num">${u.quoteFrom}: ${esc(q.customerid)}</div>` : "";
    return `<div class="quote"><div class="tag">${u.clientQuote}</div><div class="es">«${esc(q.es)}»</div>${secondary}${idLine}</div>`;
  }).join("");
  return `<details class="mega-item">
      <summary class="mega-item-head">
        <span class="name-wrap"><span class="name">${esc(t(c.reason))}</span>${trendBar(pct)}</span>
        <span class="mega-item-metric">${metricHtml}</span>
        ${megaChevron}
      </summary>
      <div class="mega-item-body">
        ${segNoteHtml}
        <div class="quotes">${quotesHtml}</div>
        <div class="callout"><span>💡</span><span><b>${u.meaningWord}:</b> ${esc(t(c.meaning))} → <b>${u.actionWord}:</b> ${esc(t(c.action))}</span></div>
        <div class="ids-block"><div class="ids-head"><span class="l">${u.idsLabel}</span>
          <button class="copy-btn" data-copy="${esc(c.ids.join(', '))}">${u.copyAllBtn}</button></div>
          <div class="ids-list">${c.ids.map(id=>`<span class="id-chip">${esc(id)}</span>`).join("")}</div></div>
      </div>
    </details>`;
}

function typeLabelKey(type){ return "type"+({Пресейл:"Presale",Обслуживание:"Service",Отмена:"Cancel",Дефект:"Defect",Смешанная:"Mixed"}[type]); }
function themeLabelKey(theme){ return "theme"+({origination:"Origination",aml_kyb:"AmlKyb",payments:"Payments",product:"Product",vas:"Vas",overdraft:"Overdraft",acquiring:"Acquiring",cancel_active:"CancelActive",misc:"Misc",calls_unresolved:"CallsUnresolved",personal_topic:"PersonalTopic"}[theme]); }

let activeTenureSeg = "all", activePfpmSeg = "all";
function anySegActive(){ return activeTenureSeg !== "all" || activePfpmSeg !== "all"; }
function bothSegActive(){ return activeTenureSeg !== "all" && activePfpmSeg !== "all"; }
function anyFilterActive(){ return anySegActive() || activeChan !== "all"; }
function segCount(c){
  if(activeChan !== "all" && c.channel !== activeChan) return 0;
  const ten = activeTenureSeg, pf = activePfpmSeg;
  if(ten === "all" && pf === "all") return c.chats + c.calls;
  if(ten !== "all" && pf !== "all"){
    const jd = c.jointKey && JOINT_TENURE_PFPM[c.jointKey];
    return (jd && jd[ten] && jd[ten][pf]) || 0;
  }
  if(ten !== "all") return (c.tenureCounts && c.tenureCounts[ten]) || 0;
  return (c.pfpmCounts && c.pfpmCounts[pf]) || 0;
}
function computeThemeGroups(){
  const groups = {};
  CATS.forEach(c => { (groups[c.theme] = groups[c.theme] || []).push(c); });
  const gapRank = {misc:2, calls_unresolved:1, personal_topic:3}; // "we don't have a real topic" (calls_unresolved, misc) plus "real topic but not a PyME one at all" (personal_topic) — always last, personal_topic last of all since it's not even a PyME-team concern
  const groupThemes = Object.keys(groups).sort((a,b)=>{
    const ra = gapRank[a]||0, rb = gapRank[b]||0;
    if(ra || rb) return ra - rb;
    const totalA = groups[a].reduce((s,c)=>s+c.clients,0);
    const totalB = groups[b].reduce((s,c)=>s+c.clients,0);
    return totalB - totalA;
  });
  return groupThemes.map(theme => {
    const rawItems = groups[theme];
    // collapse pairKey siblings into single render units
    const seenPairs = new Set();
    const units = [];
    rawItems.forEach(c => {
      if(c.pairKey){
        if(seenPairs.has(c.pairKey)) return;
        seenPairs.add(c.pairKey);
        const partner = CATS.find(x => x.pairKey === c.pairKey && x !== c);
        units.push(partner ? {kind:"pair", a:c, b:partner, clients:segCount(c)+segCount(partner), tickets:segCount(c)+segCount(partner), isMisc: !!(c.isMisc||partner.isMisc)} : {kind:"solo", cat:c, clients:segCount(c), tickets:segCount(c), isMisc: !!c.isMisc});
      } else {
        units.push({kind:"solo", cat:c, clients:segCount(c), tickets:segCount(c), isMisc: !!c.isMisc});
      }
    });
    const subgroupRank = {second_application:1, post_account:2}; // main group (no subgroup) always first; order among the rest is arbitrary but stable
    units.sort((x,y)=>{
      if(x.isMisc !== y.isMisc) return x.isMisc ? 1 : -1;
      const sx = (x.kind==="solo" && x.cat.subgroup) ? (subgroupRank[x.cat.subgroup]||9) : 0;
      const sy = (y.kind==="solo" && y.cat.subgroup) ? (subgroupRank[y.cat.subgroup]||9) : 0;
      if(sx !== sy) return sx - sy;
      return y.clients - x.clients;
    });
    const totalClients = units.reduce((s,u)=>s+u.clients,0);
    const totalTickets = units.reduce((s,u)=>s+u.tickets,0);
    return {theme, units, totalClients, totalTickets, groupPct: pctOfTotal(totalClients)};
  });
}
function renderThemeChart(){
  const u = UI[currentLang];
  const groups = computeThemeGroups();
  const maxClients = Math.max(...groups.map(g=>g.totalClients));
  const rows = groups.map(g => `<div class="ov-row">
      <span class="ov-label">${u[themeLabelKey(g.theme)] || g.theme}</span>
      <div class="ov-track"><div class="ov-fill theme-${esc(g.theme)}" style="width:${(g.totalClients/maxClients*100).toFixed(1)}%"></div></div>
      <span class="ov-value"><span class="num">${g.totalClients}</span> · <span class="num">${g.groupPct.toFixed(1)}%</span></span>
    </div>`).join("");
  document.getElementById("themeChart").innerHTML = rows;
}
function renderCatRows(){
  const html = computeThemeGroups().map(g => renderMegaCard(g.theme, g.units, g.totalClients, g.groupPct, g.totalTickets)).join("");
  document.getElementById("catRows").innerHTML = html;
}

        <svg class="chevron" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

  document.getElementById("cloRows").innerHTML =

let activeType = "all", activeChan = "all", searchTerm = "";
function matchesFilters(el){
  const typeOk = activeType === "all" || el.dataset.type === activeType || el.dataset.pairSecondType === activeType;
  const chanOk = activeChan === "all" || el.dataset.chan === activeChan || el.dataset.pairSecondChan === activeChan;
  const searchOk = !searchTerm || el.dataset.name.includes(searchTerm) || el.dataset.desc.includes(searchTerm);
  const segOk = !anySegActive() || el.dataset.segCount === undefined || Number(el.dataset.segCount) > 0;
  return typeOk && chanOk && searchOk && segOk;
}
function applyFilters(){
  let visible = 0;
  document.querySelectorAll("#catRows .type-group").forEach(group=>{
    if(group.classList.contains("mega-theme-card")){
      let itemsVisible = 0;
      group.querySelectorAll(".mega-item").forEach(item=>{
        const show = matchesFilters(item);
        item.style.display = show ? "" : "none";
        if(show) itemsVisible++;
      });
      group.style.display = itemsVisible > 0 ? "" : "none";
      visible += itemsVisible;
      return;
    }
    let groupVisible = 0;
    group.querySelectorAll(".row").forEach(row=>{
      const show = matchesFilters(row);
      row.style.display = show ? "" : "none";
      if(show) groupVisible++;
    });
    group.style.display = groupVisible > 0 ? "" : "none";
    visible += groupVisible;
  });
  document.getElementById("catEmpty").style.display = visible === 0 ? "block" : "none";
}

document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=>{ currentLang = btn.dataset.lang; applyUIStrings(); });
});
function updateSegCaveat(){
  const u = UI[currentLang];
  const el = document.getElementById("globalSegCaveat");
  const on = anySegActive();
  el.style.display = on ? "" : "none";
  el.textContent = on ? (u.segCaveat + (bothSegActive() ? u.segCaveatBoth : "")) : "";
}
document.addEventListener("click", e=>{
  const chip = e.target.closest(".chip[data-type], .chip[data-chan]");
  if(chip){
    if(chip.dataset.type !== undefined){
      document.querySelectorAll(".chip[data-type]").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active"); activeType = chip.dataset.type;
    } else {
      document.querySelectorAll(".chip[data-chan]").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active"); activeChan = chip.dataset.chan;
      renderKpis();
      renderThemeChart();
      renderCatRows();
      renderCsatChart();
      renderCloRows();
    }
    applyFilters();
  }
  const segChip = e.target.closest(".chip[data-tenure-seg], .chip[data-pfpm-seg]");
  if(segChip){
    if(segChip.dataset.tenureSeg !== undefined){
      document.querySelectorAll(".chip[data-tenure-seg]").forEach(c=>c.classList.remove("active"));
      segChip.classList.add("active"); activeTenureSeg = segChip.dataset.tenureSeg;
    } else {
      document.querySelectorAll(".chip[data-pfpm-seg]").forEach(c=>c.classList.remove("active"));
      segChip.classList.add("active"); activePfpmSeg = segChip.dataset.pfpmSeg;
    }
    updateSegCaveat();
    renderThemeChart();
    renderCatRows();
    renderKpis();
    renderCsatChart();
    renderCloRows();
    applyFilters();
  }
  const jumpBtn = e.target.closest("nav.jump button");
  if(jumpBtn){
    document.querySelectorAll("nav.jump button").forEach(b=>b.classList.remove("active"));
    jumpBtn.classList.add("active");
    document.getElementById(jumpBtn.dataset.jump).scrollIntoView({behavior:"smooth", block:"start"});
  }
  const copyBtn = e.target.closest(".copy-btn");
  if(copyBtn){
    navigator.clipboard?.writeText(copyBtn.dataset.copy).then(()=>{
      const old = copyBtn.textContent; copyBtn.textContent = UI[currentLang].copiedBtn;
      setTimeout(()=>copyBtn.textContent = old, 1400);
    }).catch(()=>{});
  }
});
document.getElementById("catSearch").addEventListener("input", e=>{ searchTerm = e.target.value.trim().toLowerCase(); applyFilters(); });

applyUIStrings();
</script>
